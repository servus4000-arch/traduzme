<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/os.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Open Sans',sans-serif;background:#EEDECE}
#stage{position:absolute;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.abs{position:absolute}
.hl{position:absolute;left:90px;width:860px;font-weight:800;line-height:1.08;letter-spacing:-1px}
.sl{position:absolute;left:90px;width:840px;font-size:54px;font-weight:600;line-height:1.2}
.shape{position:absolute;border-radius:50%}
.lucas .ol{stroke:var(--lo,#1F3B35);stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.kick{position:absolute;left:90px;font-size:44px;font-weight:800;letter-spacing:3px}
#trk{position:absolute;left:60px;top:150px;width:880px;height:180px;border-radius:40px;background:#fff;box-shadow:0 10px 0 rgba(31,59,53,.18);z-index:50;display:none}
.st{position:absolute;top:30px;width:80px;height:80px;border-radius:50%;background:#BDCBCB;border:6px solid #1F3B35}
.stl{position:absolute;top:122px;width:240px;margin-left:-120px;text-align:center;font-size:34px;font-weight:800;color:#1F3B35}
.phone{position:absolute;border-radius:56px;background:#1F3B35;padding:22px}
.screen{position:relative;width:100%;height:100%;border-radius:38px;background:#fff;overflow:hidden}
.push{position:absolute;left:18px;right:18px;border-radius:26px;background:#EEDECE;border:4px solid #1F3B35;display:flex;align-items:center;gap:16px;padding:16px 18px;font-size:30px;font-weight:800;color:#1F3B35;line-height:1.1}
.conf{position:absolute;width:16px;height:26px;border-radius:4px;opacity:0}
.cardx{position:absolute;width:400px;height:360px;border-radius:30px;background:#fff;border:6px solid #1F3B35;box-shadow:0 12px 0 rgba(31,59,53,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-size:40px;font-weight:800;color:#1F3B35;text-align:center;line-height:1.1}
.day{position:absolute;top:0;width:150px;height:150px;border-radius:24px;background:#fff;border:5px solid #1F3B35;font-size:34px;font-weight:800;color:#1F3B35;text-align:center;padding-top:14px}
</style></head>
<body><div id="stage"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const C={pinho:'#376259',salvia:'#97B9A8',nevoa:'#BDCBCB',areia:'#EEDECE',dark:'#1F3B35',w:'#fff'};
const S=[['s1',0],['s2',4.4],['e1',8.0],['e2',15.8],['e2b',23.6],['e3',28.0],['e4',34.4],['bon',41.2],['rec',45.8],['end',50.6]];
const END=57.8; const ST=Object.fromEntries(S);
const SX=[110,330,550,770]; // Stationsmitte relativ zur Leiste
const TR={s2:{k:'top'},e1:{k:'circle',x:60+SX[0],y:220},e2:{k:'circle',x:60+SX[1],y:220},e2b:{k:'left'},e3:{k:'circle',x:60+SX[2],y:220},e4:{k:'circle',x:60+SX[3],y:220},bon:{k:'top'},rec:{k:'circle',x:540,y:900},end:{k:'top'}};
const TD=0.5;

// ---------- Figuren ----------
let LID=0;
function figSVG(o={}){
  const id='L'+(LID++); const hood=o.hood||C.salvia, skin=C.areia, hair=o.hair||C.dark, pants=C.dark;
  const longHair=o.long?`<path class="ol" d="M58 110 Q40 250 70 300 L230 300 Q262 250 242 110 Z" fill="${hair}"/>`:'';
  const fringe=o.long?`<path class="ol" d="M62 108 Q56 18 150 14 Q246 16 240 108 Q200 50 150 56 Q100 50 62 108 Z" fill="${hair}"/>`
                     :`<path class="ol" d="M64 100 Q60 20 150 16 Q246 18 238 104 Q214 70 182 66 Q170 92 120 70 Q92 74 64 100 Z" fill="${hair}"/>`;
  const tie=o.tie?`<path class="ol" d="M140 206 L160 206 L166 300 L150 322 L134 300 Z" fill="${C.pinho}"/>`:'';
  return {id,html:`<svg class="lucas" id="${id}" viewBox="-20 -20 340 840" width="${o.w||300}" style="overflow:visible;--lo:${o.lo||C.dark}">
  <g>${longHair}</g>
  <g><rect class="ol" x="88" y="470" width="62" height="280" rx="26" fill="${pants}"/><rect class="ol" x="150" y="470" width="62" height="280" rx="26" fill="${pants}"/>
  <ellipse class="ol" cx="115" cy="772" rx="42" ry="22" fill="${C.w}"/><ellipse class="ol" cx="186" cy="772" rx="42" ry="22" fill="${C.w}"/></g>
  <g id="${id}armL" style="transform-origin:78px 235px"><rect class="ol" x="52" y="225" width="46" height="215" rx="23" fill="${hood}"/><circle class="ol" cx="75" cy="450" r="26" fill="${skin}"/></g>
  <path class="ol" d="M70 250 Q70 200 150 196 Q230 200 230 250 L236 480 Q150 496 64 480 Z" fill="${hood}"/>
  ${tie}
  <path class="ol" d="M118 200 Q150 236 182 200" fill="none"/>
  <g id="${id}head" style="transform-origin:150px 190px">
   <rect class="ol" x="132" y="170" width="36" height="34" fill="${skin}"/>
   <circle class="ol" cx="150" cy="105" r="88" fill="${skin}"/>
   ${fringe}
   <circle class="ol" cx="62" cy="112" r="14" fill="${skin}"/><circle class="ol" cx="238" cy="112" r="14" fill="${skin}"/>
   <g id="${id}eyes" style="transform-origin:150px 108px"><g id="${id}pup"><ellipse cx="118" cy="108" rx="10" ry="13" fill="${C.dark}"/><ellipse cx="182" cy="108" rx="10" ry="13" fill="${C.dark}"/></g></g>
   <path id="${id}m_smile" d="M118 142 Q150 168 182 142" stroke="${C.dark}" stroke-width="7" fill="none" stroke-linecap="round"/>
   <path id="${id}m_grin" d="M112 136 Q150 136 188 136 Q184 178 150 180 Q116 178 112 136 Z" fill="${C.dark}" style="display:none"/>
   <ellipse id="${id}m_o" cx="150" cy="150" rx="14" ry="18" fill="${C.dark}" style="display:none"/>
   <path id="${id}m_flat" d="M126 152 Q150 144 174 152" stroke="${C.dark}" stroke-width="7" fill="none" stroke-linecap="round" style="display:none"/>
  </g>
  <g id="${id}armR" style="transform-origin:222px 235px"><rect class="ol" x="202" y="225" width="46" height="215" rx="23" fill="${hood}"/><circle class="ol" cx="225" cy="450" r="26" fill="${skin}"/></g>
  </svg>`};
}
function mouth(id,m){['smile','grin','o','flat'].forEach(k=>{const e=$(id+'m_'+k);if(e)e.style.display=(k===m?'block':'none')})}
function blink(id,t,seed=0){const p=((t+seed)%3.1);const s=p<.12?1-Math.sin(p/.12*Math.PI)*.92:1;$(id+'eyes').style.transform=`scaleY(${s})`}
const FIG={}; FIG.e1=null;
function bia(key,w,hood){const F=figSVG({w,long:true,hood:hood||C.salvia}); FIG[key]=F; return F.html}
// ---------- Bausteine ----------
function txtIn(el,t,a,dur=.4){if(!el)return;const p=eo(lin(t,a,a+dur));el.style.opacity=p;el.style.transform=`translateY(${(1-p)*24}px)`}
function popIn(el,t,a,dur=.35,base=''){const p=lin(t,a,a+dur);el.style.opacity=p>0?1:0;const s=p<=0?0:back(p);el.style.transform=base+` scale(${s})`}
function drift(el,t,ax,ay,ph){el.style.transform=`translate(${Math.sin(t/6*2*Math.PI+ph)*ax}px,${Math.cos(t/6*2*Math.PI+ph)*ay}px)`}
function shapes(col,arr){return arr.map((s,i)=>`<div class="shape sh" data-ph="${i*1.7}" style="left:${s[0]}px;top:${s[1]}px;width:${s[2]}px;height:${s[2]}px;background:${col}"></div>`).join('')}
function sh(sc,t){document.querySelectorAll('#'+sc+' .sh').forEach(e=>drift(e,t,30,30,+e.dataset.ph))}
function check(col,size,stroke='#fff'){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="${col}"/><path d="M6.5 12.5 L10.5 16.5 L17.5 8" stroke="${stroke}" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function docIcon(w=56){return `<svg width="${w}" height="${w*1.2}" viewBox="0 0 50 60"><path d="M4 4 H34 L46 16 V56 H4 Z" fill="#fff" stroke="${C.dark}" stroke-width="4" stroke-linejoin="round"/><path d="M34 4 V16 H46" fill="${C.nevoa}" stroke="${C.dark}" stroke-width="4" stroke-linejoin="round"/><path d="M12 26 H38 M12 35 H38 M12 44 H28" stroke="${C.pinho}" stroke-width="4" stroke-linecap="round"/></svg>`}
function envelope(w=120){return `<svg width="${w}" height="${w*.72}" viewBox="0 0 100 72"><rect x="3" y="3" width="94" height="66" rx="8" fill="#fff" stroke="${C.dark}" stroke-width="5"/><path d="M5 8 L50 42 L95 8" fill="none" stroke="${C.dark}" stroke-width="5" stroke-linejoin="round"/></svg>`}
function confetti(n,x,y){let h='';for(let i=0;i<n;i++)h+=`<div class="conf" data-i="${i}" style="left:${x}px;top:${y}px"></div>`;return h}
function confAt(sc,t,a){document.querySelectorAll('#'+sc+' .conf').forEach(e=>{const i=+e.dataset.i;const p=t-a;if(p<0||p>1.5){e.style.opacity=0;return}
  const ang=(sc==='rec'?(15+i*10):(-160+i*(140/14)))*Math.PI/180, v=560+((i*37)%5)*70; const x=Math.cos(ang)*v*p, y=Math.sin(ang)*v*p+950*p*p;
  e.style.opacity=1-lin(p,1.1,1.5); e.style.transform=`translate(${x}px,${y}px) rotate(${p*720+i*40}deg)`; e.style.background=i%3?C.pinho:(i%2?C.areia:C.salvia);})}

// ---------- Tracker (global) ----------
const LBL=['Pix','Conferência','Tradução','Entrega'];
function trackerHTML(){
 return `<div id="trk"><div class="abs" style="left:${SX[0]}px;top:66px;width:${SX[3]-SX[0]}px;height:10px;border-radius:5px;background:${C.nevoa}"></div>
  <div class="abs" id="tfill" style="left:${SX[0]}px;top:66px;width:0;height:10px;border-radius:5px;background:${C.pinho}"></div>
  ${SX.map((x,i)=>`<div class="st" id="st${i}" style="left:${x-40}px"><div class="abs" id="sr${i}" style="left:-22px;top:-22px;width:112px;height:112px;border-radius:50%;border:6px solid ${C.salvia};opacity:0"></div>
     <div class="abs" id="sc${i}" style="left:-6px;top:-6px;opacity:0">${check(C.pinho,80)}</div>
     <div class="abs" id="sx${i}" style="left:-6px;top:-6px;width:80px;height:80px;border-radius:50%;background:${C.areia};border:6px solid ${C.dark};display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:800;color:${C.dark};opacity:0">!</div></div>
     <div class="stl" id="sl${i}" style="left:${x}px">${LBL[i]}</div>`).join('')}
  <div class="abs" id="tdoc" style="left:0;top:-70px">${docIcon(52)}</div></div>`;}
// Ankunftszeiten der Doku-Marke an den Stationen (global) und Häkchen
const ARR=[ST.e1+.25,ST.e2+.25,ST.e3+.25,ST.e4+.25];
const CHK=[ST.e1+1.2,ST.e2b+2.9,ST.e3+4.7,ST.e4+3.0];
function trackerAt(t){
  const tk=$('trk'); const sc=S[sceneAt(t)][0];
  if(!(t>=ST.s2+.15 && t<ST.end)){tk.style.display='none';return}
  tk.style.display='block';
  // Position: s2 groß in der Mitte, fliegt hoch; rec wieder in die Mitte
  let y=150, s=1;
  const Y0=390;
  if(t<ST.e1){const p=eio(lin(t,ST.s2+2.6,ST.s2+3.3)); y=Y0-(Y0-150)*p; s=1.0;
    const pin=eo(lin(t,ST.s2+.15,ST.s2+.55)); tk.style.opacity=pin;}
  else tk.style.opacity=1;
  if(t>=ST.rec){const p=eio(lin(t,ST.rec,ST.rec+.6)); y=150+(700-150)*p;}
  tk.style.transformOrigin='50% 50%';
  tk.style.transform=`translateY(${y-150}px) scale(${s})`;
  // Doku-Marke
  let pos=SX[0]-26, bob=Math.sin(t*5)*4;
  if(t<ARR[0]-.25){pos=SX[0]-26; bob=Math.abs(Math.sin(t*4))*-14;}
  for(let i=0;i<4;i++){const a=ARR[i]-.25; if(t>=a){const from=i?SX[i-1]:SX[0]; const p=eo(lin(t,a,a+.5)); pos=from+(SX[i]-from)*p-26;}}
  if(t>=ST.rec){pos=SX[3]-26}
  $('tdoc').style.transform=`translate(${pos}px,${bob}px)`;
  // Füllung bis zur letzten erreichten Station
  let fw=0; for(let i=1;i<4;i++){const a=ARR[i]-.25; if(t>=a)fw=(SX[i]-SX[0])*eo(lin(t,a,a+.5))+ (i>1?0:0); }
  if(t>=ARR[1]-.25){const k=ARR.filter(a=>t>=a-.25).length-1; const a=ARR[k]-.25; fw=(SX[k-1]-SX[0])+(SX[k]-SX[k-1])*eo(lin(t,a,a+.5));}
  $('tfill').style.width=fw+'px';
  for(let i=0;i<4;i++){
    const active=t>=ARR[i]-.05 && (i==3?true:t<ARR[i+1]-.25);
    const st=$('st'+i); st.style.background=t>=ARR[i]-.05?C.areia:C.nevoa;
    const rp=(t-ARR[i]); $('sr'+i).style.opacity=active&&rp>0?.4+.6*Math.abs(Math.sin(rp*3)):0; $('sr'+i).style.transform=`scale(${1+.08*Math.sin(rp*6)})`;
    const ck=t>=ST.rec? ST.rec+.7+i*.4 : CHK[i]; popIn($('sc'+i),t,ck,.35);
    $('sl'+i).style.color=active?C.pinho:C.dark; $('sl'+i).style.opacity=active||t<ST.e1||t>=ST.rec?1:.55;
  }
  // "!" an Station 2 (Fund einer Seite) 14.4+4.4 .. Häkchen
  const xa=ST.e2+3.3; const xv=t>=xa&&t<CHK[1]; $('sx1').style.opacity=xv?1:0; $('sx1').style.transform=xv?`scale(${1+.12*Math.abs(Math.sin((t-xa)*5))})`:'none';
  if(t>=ST.rec){for(let i=0;i<4;i++)$('sr'+i).style.opacity=0; $('sx1').style.opacity=0;}
}

// ---------- Szenen ----------
const stage=$('stage');
stage.innerHTML=`
<div class="scene" id="s1" style="background:${C.areia}">
  ${shapes('rgba(151,185,168,.35)',[[760,80,380],[-220,1300,460]])}
  <div class="hl" id="s1h" style="top:200px;font-size:92px;color:${C.dark}">Pagou o Pix<br>da tradução…</div>
  <div class="hl" id="s1q" style="top:420px;font-size:150px;color:${C.pinho}">E agora?</div>
  <div class="phone" id="s1p" style="left:110px;top:640px;width:430px;height:820px"><div class="screen" style="background:${C.w}">
    <div class="abs" style="left:30px;top:40px;font-size:30px;font-weight:800;color:${C.pinho}">traduzme</div>
    <div class="abs" style="left:30px;top:100px;width:326px;height:300px;border-radius:24px;background:${C.areia};display:flex;align-items:center;justify-content:center">
      <svg width="210" height="210" viewBox="0 0 21 21">${(()=>{let r='';for(let y=0;y<21;y++)for(let x=0;x<21;x++){const f=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);const fin=f&&((x%6==0||y%6==0)||(x>1&&x<5&&y>1&&y<5)||(x>15&&x<19&&y>1&&y<5)||(x>1&&x<5&&y>15&&y<19));const rnd=!f&&((x*7+y*13+x*y)%3==0);if(fin||rnd)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${C.dark}"/>`}return r})()}</svg></div>
    <div class="abs" style="left:30px;top:428px;width:340px;font-size:25px;font-weight:700;color:${C.dark};line-height:1.25">Certidão de nascimento<br>Tradução juramentada</div>
    <div class="abs" id="s1b" style="left:30px;top:560px;width:326px;height:110px;border-radius:55px;background:${C.pinho};color:#fff;font-size:38px;font-weight:800;display:flex;align-items:center;justify-content:center">Pagar com Pix</div>
    <div class="abs" id="s1d" style="left:150px;top:690px;font-size:60px;font-weight:800;color:${C.pinho};letter-spacing:6px;opacity:0">• • •</div>
    <div class="abs" id="s1f" style="left:230px;top:600px;width:90px;height:90px;border-radius:50%;background:rgba(31,59,53,.35);border:5px solid ${C.dark}"></div>
  </div></div>
  <div class="abs" style="left:560px;top:1040px;width:420px;height:420px;border-radius:50%;background:${C.salvia}"></div>
  <div class="abs" id="s1B" style="left:640px;top:840px;width:280px;height:600px;overflow:visible">${bia('s1',270)}</div>
  ${[0,1,2].map(i=>`<div class="abs s1qm" id="s1m${i}" style="left:${640+i*95}px;top:${780-(i%2)*50}px;font-size:110px;font-weight:800;color:${C.pinho};opacity:0">?</div>`).join('')}
</div>
<div class="scene" id="s2" style="background:${C.nevoa}">
  ${shapes('rgba(255,255,255,.35)',[[700,1100,440],[-200,500,380]])}
  <div class="kick" id="s2k" style="top:730px;color:${C.pinho}">RASTREIO DA TRADUÇÃO</div>
  <div class="hl" id="s2h" style="top:800px;font-size:84px;color:${C.dark}">Acompanhe<br>as 4 etapas.</div>
  <div class="abs" id="s2c" style="left:30px;top:300px;width:940px;height:360px;border-radius:44px;background:${C.areia}"></div>
  <div class="abs" id="s2B" style="left:700px;top:950px;width:240px;height:350px;overflow:visible">${bia('s2',220)}</div>
</div>
<div class="scene" id="e1" style="background:${C.areia}">
  ${shapes('rgba(151,185,168,.3)',[[780,1250,380]])}
  <div class="hl" id="e1h" style="top:390px;width:920px;font-size:72px;color:${C.dark}">1. Pix confirmado<br>automaticamente</div>
  <div class="sl" id="e1s" style="top:590px;width:900px;font-size:48px;color:${C.pinho};font-weight:700">Prazo em dias úteis. Pix até 16h<br>em dia útil conta no mesmo dia.</div>
  <div class="phone" id="e1p" style="left:100px;top:800px;width:400px;height:680px"><div class="screen" style="background:${C.nevoa}">
    <div class="abs" style="left:0;top:220px;width:356px;text-align:center;font-size:96px;font-weight:300;color:${C.dark}">14:32</div>
    <div class="push" id="e1n" style="top:30px">${check(C.pinho,56)}<div>Pagamento<br>confirmado!</div></div>
    <div class="abs" id="e1m" style="left:118px;top:400px;opacity:0">${envelope(120)}</div>
  </div></div>
  <div class="abs" id="e1c" style="left:590px;top:830px;width:330px;height:330px;border-radius:50%;background:#fff;border:8px solid ${C.dark}">
    ${[...Array(12)].map((_,i)=>`<div class="abs" style="left:157px;top:10px;width:8px;height:26px;background:${C.dark};transform-origin:4px 147px;transform:rotate(${i*30}deg)"></div>`).join('')}
    <div class="abs" style="left:110px;top:200px;width:110px;text-align:center;font-size:44px;font-weight:800;color:${C.pinho}">16h</div>
    <div class="abs" id="e1hh" style="left:153px;top:80px;width:12px;height:85px;border-radius:6px;background:${C.dark};transform-origin:6px 85px"></div>
    <div class="abs" id="e1mh" style="left:155px;top:40px;width:8px;height:125px;border-radius:4px;background:${C.pinho};transform-origin:4px 125px"></div>
    <div class="abs" style="left:145px;top:145px;width:30px;height:30px;border-radius:50%;background:${C.dark}"></div></div>
  <div class="abs" id="e1t" style="left:600px;top:1190px;width:310px;height:84px;border-radius:42px;background:${C.pinho};color:#fff;font-size:40px;font-weight:800;display:flex;align-items:center;justify-content:center;opacity:0">mesmo dia</div>
</div>
<div class="scene" id="e2" style="background:${C.nevoa}">
  ${shapes('rgba(255,255,255,.35)',[[-180,1240,400]])}
  <div class="hl" id="e2h" style="top:390px;width:920px;font-size:70px;color:${C.dark}">2. Primeiro, o tradutor<br>confere tudo</div>
  <div class="sl" id="e2s" style="top:600px;color:${C.pinho};font-weight:700">Algo não bate?<br>Avisamos em 1 dia útil.</div>
  <div class="abs" style="left:60px;top:1060px;width:400px;height:400px;border-radius:50%;background:${C.areia}"></div>
  <div class="abs" id="e2T" style="left:110px;top:790px;width:300px;height:650px;overflow:visible">${(()=>{const F=figSVG({w:290,hood:C.pinho,tie:false});FIG.e2=F;return F.html})()}</div>
