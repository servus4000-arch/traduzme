<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/os.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:'Open Sans',sans-serif;background:#376259}
#stage{position:absolute;inset:0;overflow:hidden}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.abs{position:absolute}
.hl{position:absolute;left:90px;width:850px;font-weight:800;line-height:1.08;letter-spacing:-1px}
.sl{position:absolute;left:90px;width:850px;font-size:54px;font-weight:700;line-height:1.2}
.shape{position:absolute;border-radius:50%}
.lucas .ol{stroke:var(--lo,#1F3B35);stroke-width:6;stroke-linejoin:round;stroke-linecap:round}
.phone{position:absolute;border-radius:56px;background:#1F3B35;padding:22px}
.screen{position:relative;width:100%;height:100%;border-radius:38px;background:#fff;overflow:hidden}
.chip{position:absolute;height:96px;padding:0 40px;border-radius:48px;font-size:44px;font-weight:800;display:flex;align-items:center;gap:16px;white-space:nowrap}
.pill{position:absolute;width:400px;height:130px;border-radius:65px;border:6px solid #1F3B35;font-size:52px;font-weight:800;display:flex;align-items:center;justify-content:center}
.blk{display:inline-block;border-radius:14px;background:#97B9A8;position:relative;overflow:hidden;vertical-align:middle}
.blk i{position:absolute;top:-20px;width:22px;height:140px;background:rgba(255,255,255,.65);transform:rotate(20deg)}
.rc{position:absolute;width:400px;height:300px;border-radius:30px;background:#fff;border:6px solid #1F3B35;box-shadow:0 10px 0 rgba(31,59,53,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:44px;font-weight:800;color:#1F3B35;text-align:center;line-height:1.08}
.conf{position:absolute;width:16px;height:26px;border-radius:4px;opacity:0}
</style></head>
<body><div id="stage"></div>
<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const back=x=>{const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const C={pinho:'#376259',salvia:'#97B9A8',nevoa:'#BDCBCB',areia:'#EEDECE',dark:'#1F3B35',w:'#fff'};
const S=[['s1',0],['s2',3.8],['e1',8.4],['e2',14.2],['e3',18.2],['e4',23.6],['e5',30.0],['rec',34.6],['end',39.2]];
const END=45.0; const ST=Object.fromEntries(S);
const MX=855, MY=290; // Mini-Uhr Mittelpunkt
const TR={s2:{k:'top'},e1:{k:'circle',x:MX,y:MY},e2:{k:'circle',x:MX,y:MY},e3:{k:'circle',x:MX,y:MY},e4:{k:'circle',x:MX,y:MY},e5:{k:'circle',x:MX,y:MY},rec:{k:'circle',x:MX,y:MY},end:{k:'top',d:.3}};
const TD=0.5;
// ---------- Figuren ----------
let LID=0;
function figSVG(o={}){
  const id='L'+(LID++); const hood=o.hood||C.salvia, skin=C.areia, hair=o.hair||C.dark, pants=C.dark;
  const longHair=o.long?`<path class="ol" d="M58 110 Q40 250 70 300 L230 300 Q262 250 242 110 Z" fill="${hair}"/>`:'';
  const fringe=o.long?`<path class="ol" d="M62 108 Q56 18 150 14 Q246 16 240 108 Q200 50 150 56 Q100 50 62 108 Z" fill="${hair}"/>`
                     :`<path class="ol" d="M64 100 Q60 20 150 16 Q246 18 238 104 Q214 70 182 66 Q170 92 120 70 Q92 74 64 100 Z" fill="${hair}"/>`;
  const tie=o.tie?`<path class="ol" d="M140 206 L160 206 L166 300 L150 322 L134 300 Z" fill="${C.pinho}"/>`:'';
  return {id,html:`<svg class="lucas" id="${id}" viewBox="-20 -20 340 840" width="${o.w||300}" style="overflow:visible;--lo:${o.lo||C.dark}">
  <g>${longHair}</g>
  <g><rect class="ol" x="88" y="470" width="62" height="280" rx="26" fill="${pants}"/><rect class="ol" x="150" y="470" width="62" height="280" rx="26" fill="${pants}"/>
  <ellipse class="ol" cx="115" cy="772" rx="42" ry="22" fill="${C.w}"/><ellipse class="ol" cx="186" cy="772" rx="42" ry="22" fill="${C.w}"/></g>
  <g id="${id}armL" style="transform-origin:78px 235px"><rect class="ol" x="52" y="225" width="46" height="215" rx="23" fill="${hood}"/><circle class="ol" cx="75" cy="450" r="26" fill="${skin}"/></g>
  <path class="ol" d="M70 250 Q70 200 150 196 Q230 200 230 250 L236 480 Q150 496 64 480 Z" fill="${hood}"/>
  ${tie}
  <path class="ol" d="M118 200 Q150 236 182 200" fill="none"/>
  <g id="${id}head" style="transform-origin:150px 190px">
   <rect class="ol" x="132" y="170" width="36" height="34" fill="${skin}"/>
   <circle class="ol" cx="150" cy="105" r="88" fill="${skin}"/>
   ${fringe}
   <circle class="ol" cx="62" cy="112" r="14" fill="${skin}"/><circle class="ol" cx="238" cy="112" r="14" fill="${skin}"/>
   <g id="${id}eyes" style="transform-origin:150px 108px"><g id="${id}pup"><ellipse cx="118" cy="108" rx="10" ry="13" fill="${C.dark}"/><ellipse cx="182" cy="108" rx="10" ry="13" fill="${C.dark}"/></g></g>
   <path id="${id}m_smile" d="M118 142 Q150 168 182 142" stroke="${C.dark}" stroke-width="7" fill="none" stroke-linecap="round"/>
   <path id="${id}m_grin" d="M112 136 Q150 136 188 136 Q184 178 150 180 Q116 178 112 136 Z" fill="${C.dark}" style="display:none"/>
   <ellipse id="${id}m_o" cx="150" cy="150" rx="14" ry="18" fill="${C.dark}" style="display:none"/>
   <path id="${id}m_flat" d="M126 152 Q150 144 174 152" stroke="${C.dark}" stroke-width="7" fill="none" stroke-linecap="round" style="display:none"/>
  </g>
  <g id="${id}armR" style="transform-origin:222px 235px"><rect class="ol" x="202" y="225" width="46" height="215" rx="23" fill="${hood}"/><circle class="ol" cx="225" cy="450" r="26" fill="${skin}"/></g>
  </svg>`};
}
function mouth(id,m){['smile','grin','o','flat'].forEach(k=>{const e=$(id+'m_'+k);if(e)e.style.display=(k===m?'block':'none')})}
function blink(id,t,seed=0){const p=((t+seed)%3.1);const s=p<.12?1-Math.sin(p/.12*Math.PI)*.92:1;$(id+'eyes').style.transform=`scaleY(${s})`}
const FIG={}; FIG.e1=null;
function bia(key,w,hood){const F=figSVG({w,long:true,hood:hood||C.salvia}); FIG[key]=F; return F.html}
// ---------- Bausteine ----------
function txtIn(el,t,a,dur=.4){if(!el)return;const p=eo(lin(t,a,a+dur));el.style.opacity=p;el.style.transform=`translateY(${(1-p)*24}px)`}
function popIn(el,t,a,dur=.35,base=''){const p=lin(t,a,a+dur);el.style.opacity=p>0?1:0;const s=p<=0?0:back(p);el.style.transform=base+` scale(${s})`}
function drift(el,t,ax,ay,ph){el.style.transform=`translate(${Math.sin(t/6*2*Math.PI+ph)*ax}px,${Math.cos(t/6*2*Math.PI+ph)*ay}px)`}
function shapes(col,arr){return arr.map((s,i)=>`<div class="shape sh" data-ph="${i*1.7}" style="left:${s[0]}px;top:${s[1]}px;width:${s[2]}px;height:${s[2]}px;background:${col}"></div>`).join('')}
function sh(sc,t){document.querySelectorAll('#'+sc+' .sh').forEach(e=>drift(e,t,30,30,+e.dataset.ph))}
function check(col,size,stroke='#fff'){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="${col}"/><path d="M6.5 12.5 L10.5 16.5 L17.5 8" stroke="${stroke}" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function docIcon(w=56){return `<svg width="${w}" height="${w*1.2}" viewBox="0 0 50 60"><path d="M4 4 H34 L46 16 V56 H4 Z" fill="#fff" stroke="${C.dark}" stroke-width="4" stroke-linejoin="round"/><path d="M34 4 V16 H46" fill="${C.nevoa}" stroke="${C.dark}" stroke-width="4" stroke-linejoin="round"/><path d="M12 26 H38 M12 35 H38 M12 44 H28" stroke="${C.pinho}" stroke-width="4" stroke-linecap="round"/></svg>`}
function envelope(w=120){return `<svg width="${w}" height="${w*.72}" viewBox="0 0 100 72"><rect x="3" y="3" width="94" height="66" rx="8" fill="#fff" stroke="${C.dark}" stroke-width="5"/><path d="M5 8 L50 42 L95 8" fill="none" stroke="${C.dark}" stroke-width="5" stroke-linejoin="round"/></svg>`}
function confetti(n,x,y){let h='';for(let i=0;i<n;i++)h+=`<div class="conf" data-i="${i}" style="left:${x}px;top:${y}px"></div>`;return h}
function confAt(sc,t,a){document.querySelectorAll('#'+sc+' .conf').forEach(e=>{const i=+e.dataset.i;const p=t-a;if(p<0||p>1.5){e.style.opacity=0;return}
  const ang=(sc==='rec'?(15+i*10):(-160+i*(140/14)))*Math.PI/180, v=560+((i*37)%5)*70; const x=Math.cos(ang)*v*p, y=Math.sin(ang)*v*p+950*p*p;
  e.style.opacity=1-lin(p,1.1,1.5); e.style.transform=`translate(${x}px,${y}px) rotate(${p*720+i*40}deg)`; e.style.background=i%3?C.pinho:(i%2?C.areia:C.salvia);})}

// ---------- eigene Bausteine ----------
const ARW=(col)=>`<svg width="64" height="44" viewBox="0 0 64 44" style="vertical-align:-4px;margin:0 6px"><path d="M4 22 H54 M36 6 L56 22 L36 38" stroke="${col}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
function clockSVG(id,size){let t='';for(let i=0;i<12;i++)t+=`<rect x="62" y="${i%3?12:10}" width="6" height="${i%3?9:14}" rx="3" fill="${C.dark}" transform="rotate(${i*30} 65 65)"/>`;
 return `<svg width="${size}" height="${size}" viewBox="0 0 130 130" style="overflow:visible">
  <g id="${id}crown"><rect x="54" y="-16" width="22" height="14" rx="4" fill="${C.dark}"/><rect x="47" y="-22" width="36" height="9" rx="4" fill="${C.dark}"/></g>
  <rect x="98" y="2" width="14" height="12" rx="3" fill="${C.dark}" transform="rotate(45 105 8)"/>
  <circle cx="65" cy="65" r="60" fill="#fff" stroke="${C.dark}" stroke-width="7"/>${t}
  <path id="${id}arc" d="" fill="${C.salvia}" opacity=".55"/>
  <g id="${id}hand"><path d="M65 65 L65 20" stroke="${C.pinho}" stroke-width="7" stroke-linecap="round"/></g>
  <circle cx="65" cy="65" r="8" fill="${C.dark}"/></svg>`}
function setHand(id,deg){const h=$(id+'hand'); if(h)h.setAttribute('transform',`rotate(${deg} 65 65)`)}
const tick=t=>Math.floor(t/.5)*30;  // Zeiger springt alle 0,5 s
function hand(){return `<svg width="110" height="150" viewBox="0 0 110 150"><path d="M40 10 Q40 0 50 0 Q60 0 60 10 V70 L94 76 Q108 80 104 96 L94 140 H34 L8 96 Q2 84 14 80 L40 90 Z" fill="${C.areia}" stroke="${C.dark}" stroke-width="6" stroke-linejoin="round"/></svg>`}
function ring(el,t,a){const p=lin(t,a,a+.45); el.style.opacity=p>0&&p<1?1-p:0; el.style.transform=`scale(${.4+p*1.2})`}
function blocks(n,w,h){let s='';for(let i=0;i<n;i++)s+=`<span class="blk" style="width:${w}px;height:${h}px;margin-right:12px"><i class="shim" style="left:-40px"></i></span>`;return s}
function star(x,y,s,cls){return `<svg class="abs ${cls}" style="left:${x}px;top:${y}px;opacity:0" width="${s}" height="${s}" viewBox="0 0 20 20"><path d="M10 0 L12.5 7.5 L20 10 L12.5 12.5 L10 20 L7.5 12.5 L0 10 L7.5 7.5 Z" fill="${C.areia}"/></svg>`}
function qr(n,px,seed){let r='';for(let y=0;y<n;y++)for(let x=0;x<n;x++){const f=(x<7&&y<7)||(x>n-8&&y<7)||(x<7&&y>n-8);const fx=x>n-8?x-(n-7):x, fy=y>n-8?y-(n-7):y;
  const on=f?(fx==0||fx==6||fy==0||fy==6||(fx>1&&fx<5&&fy>1&&fy<5)):((x*seed+y*13+x*y)%3==0);if(on)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="${C.dark}"/>`}
  return `<svg width="${px}" height="${px}" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges">${r}</svg>`}
function calIcon(s){return `<svg width="${s}" height="${s}" viewBox="0 0 60 60"><rect x="4" y="10" width="52" height="46" rx="8" fill="#fff" stroke="${C.dark}" stroke-width="5"/><path d="M4 24 H56" stroke="${C.dark}" stroke-width="5"/><path d="M18 4 V16 M42 4 V16" stroke="${C.dark}" stroke-width="5" stroke-linecap="round"/><rect x="14" y="31" width="10" height="9" rx="2" fill="${C.pinho}"/><rect x="28" y="31" width="10" height="9" rx="2" fill="${C.nevoa}"/><rect x="42" y="31" width="8" height="9" rx="2" fill="${C.nevoa}"/></svg>`}

// ---------- Szenen ----------
const stage=$('stage');
stage.innerHTML=`
<div class="scene" id="s1" style="background:${C.pinho}">
  ${shapes('rgba(31,59,53,.35)',[[700,1250,460],[-220,380,380]])}
  <div class="hl" id="s1h" style="top:170px;font-size:96px;color:#fff">Quanto custa a sua juramentada?</div>
  <div class="chip" id="s1c" style="left:90px;top:520px;background:${C.areia};color:${C.dark};opacity:0">Cronômetro ligado.</div>
  <div class="abs" style="left:430px;top:720px;width:500px;height:500px;border-radius:50%;background:${C.salvia};opacity:.5"></div>
  <div class="abs" id="s1u" style="left:440px;top:730px;width:480px;height:480px">${clockSVG('bu',480)}
    <div class="abs" id="s1r" style="left:150px;top:-150px;width:180px;height:180px;border-radius:50%;border:10px solid ${C.areia};opacity:0"></div></div>
  <div class="abs" id="s1z" style="left:50px;top:810px;width:380px;height:160px;border-radius:18px;background:#fff;border:5px solid ${C.dark};padding:18px 22px;transform:rotate(-5deg);box-shadow:0 8px 0 rgba(31,59,53,.25)">
    <div style="font-size:42px;font-weight:800;color:${C.dark};line-height:1.05">certidão</div><div style="font-size:30px;font-weight:700;color:${C.pinho};margin-top:8px;white-space:nowrap">visto de estudante</div></div>
  <div class="abs" id="s1B" style="left:100px;top:990px;width:250px;height:520px;overflow:visible">${bia('s1',240)}</div>
</div>
<div class="scene" id="s2" style="background:${C.nevoa}">
  ${shapes('rgba(255,255,255,.4)',[[720,1150,420],[-200,700,360]])}
  <div class="hl" id="s2h" style="top:390px;font-size:84px;color:${C.dark}">Antes: e-mail<br>e esperar.</div>
  <div class="sl" id="s2s" style="top:590px;color:${C.pinho};font-size:58px;font-weight:800;opacity:0">Bora testar no site?</div>
  <div class="abs" id="s2L" style="left:90px;top:780px;width:560px;height:420px">
    <div class="abs" id="s2lid" style="left:0;top:0;width:560px;height:380px;border-radius:28px;background:${C.dark};padding:18px;transform-origin:50% 100%">
      <div class="abs" id="s2scr" style="left:18px;top:18px;width:524px;height:344px;border-radius:14px;background:#fff">
        <div class="abs" style="left:30px;top:34px">${envelope(96)}</div>
        <div class="abs" id="s2e" style="left:150px;top:44px;display:flex;align-items:center;gap:12px;font-size:40px;font-weight:800;color:${C.dark}">Enviado ${check(C.pinho,48)}</div>
        <div class="abs" id="s2w" style="left:30px;top:180px;width:464px;height:96px;border-radius:48px;background:${C.areia};display:flex;align-items:center;gap:18px;padding:0 26px;font-size:34px;font-weight:800;color:${C.dark};opacity:0">
          <svg id="s2sp" width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="18" stroke="${C.nevoa}" stroke-width="7" fill="none"/><path d="M23 5 A18 18 0 0 1 41 23" stroke="${C.pinho}" stroke-width="7" fill="none" stroke-linecap="round"/></svg>Aguardando resposta…</div>
      </div></div>
    <div class="abs" style="left:-30px;top:380px;width:620px;height:36px;border-radius:0 0 26px 26px;background:${C.dark}"></div><div class="abs" id="s2cl" style="left:0;top:362px;width:560px;height:18px;border-radius:7px;background:linear-gradient(${C.dark} 0 6px,${C.nevoa} 6px 12px,${C.dark} 12px);opacity:0"></div></div>
  <div class="abs" style="left:640px;top:1120px;width:320px;height:320px;border-radius:50%;background:${C.salvia}"></div>
  <div class="abs" id="s2B" style="left:700px;top:880px;width:240px;height:560px;overflow:visible">${bia('s2',230)}</div>
</div>
<div class="scene" id="e1" style="background:${C.areia}">
  ${shapes('rgba(151,185,168,.3)',[[740,1250,420]])}
  <div class="hl" id="e1h" style="top:390px;font-size:84px;color:${C.dark}">1. Envie foto<br>ou PDF</div>
  <div class="sl" id="e1s" style="top:590px;color:${C.pinho}">Frente, verso e apostila.</div>
  <div class="phone" id="e1p" style="left:90px;top:720px;width:450px;height:770px"><div class="screen">
    <div class="abs" style="left:28px;top:30px;font-size:30px;font-weight:800;color:${C.dark}">Envie seus documentos</div>
    <div class="abs" id="e1z" style="left:24px;top:92px;width:358px;height:250px;border-radius:24px;border:5px dashed ${C.salvia};background:rgba(151,185,168,.12);display:flex;align-items:center;justify-content:center">
      <svg width="96" height="96" viewBox="0 0 60 60"><path d="M30 44 V12 M16 25 L30 11 L44 25" stroke="${C.pinho}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 40 V50 H50 V40" stroke="${C.pinho}" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="abs" id="e1f" style="left:24px;top:370px;width:358px;height:96px;border-radius:20px;background:${C.areia};border:4px solid ${C.pinho};display:flex;align-items:center;gap:16px;padding:0 18px;font-size:32px;font-weight:800;color:${C.dark};opacity:0">${docIcon(48)}certidao.jpg</div>
    ${['Frente','Verso','Apostila'].map((l,i)=>`<div class="abs e1t" id="e1t${i}" style="left:${24+i*124}px;top:494px;width:110px;opacity:0">
      <div style="width:110px;height:146px;border-radius:12px;background:#fff;border:4px solid ${C.dark};position:relative">
        ${[0,1,2,3].map(k=>`<div class="abs" style="left:14px;top:${18+k*24}px;width:${k==3?44:74}px;height:9px;border-radius:5px;background:${i==2?C.salvia:C.nevoa}"></div>`).join('')}
        ${i==2?`<div class="abs" style="left:52px;top:96px;width:40px;height:40px;border-radius:50%;border:5px solid ${C.pinho}"></div>`:''}</div>
      <div style="font-size:24px;font-weight:800;color:${C.dark};text-align:center;margin-top:6px">${l}</div></div>`).join('')}
  </div></div>
  <div class="abs" id="e1ph" style="left:640px;top:820px;width:230px;height:290px;border-radius:14px;background:#fff;border:6px solid ${C.dark};box-shadow:0 10px 0 rgba(31,59,53,.2)">
    <div class="abs" style="left:24px;top:24px;width:170px;height:16px;border-radius:8px;background:${C.pinho}"></div>
    ${[0,1,2,3,4].map(k=>`<div class="abs" style="left:24px;top:${66+k*34}px;width:${k%2?120:170}px;height:12px;border-radius:6px;background:${C.nevoa}"></div>`).join('')}
    <div class="abs" style="left:140px;top:210px;width:56px;height:56px;border-radius:50%;border:6px solid ${C.salvia}"></div></div>
  <div class="chip" id="e1c" style="left:580px;top:1190px;padding:0 30px;background:${C.pinho};color:#fff;opacity:0">${check(C.w,56,C.pinho)}valor certo</div>
</div>
<div class="scene" id="e2" style="background:${C.nevoa}">
  ${shapes('rgba(255,255,255,.4)',[[-180,1250,420]])}
  <div class="hl" id="e2h" style="top:390px;font-size:84px;color:${C.dark}">2. Escolha<br>os idiomas</div>
  <div class="sl" id="e2s" style="top:590px;color:${C.pinho}">Origem${ARW(C.pinho)}destino.</div>
  <div class="pill" id="e2a" style="left:90px;top:760px;background:#fff;color:${C.dark}">Português</div>
  <div class="abs" id="e2r" style="left:220px;top:915px;width:140px;height:140px;border-radius:50%;background:${C.areia};border:6px solid ${C.dark};display:flex;align-items:center;justify-content:center">
    <svg width="70" height="70" viewBox="0 0 60 60"><path d="M30 8 V48 M14 34 L30 50 L46 34" stroke="${C.dark}" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="pill" id="e2b" style="left:90px;top:1080px;background:#fff;color:${C.dark}">Inglês</div>
  <div class="abs" id="e2ring" style="left:150px;top:1005px;width:280px;height:280px;border-radius:50%;border:10px solid ${C.pinho};opacity:0"></div>
  <div class="abs" id="e2P" style="left:330px;top:1150px">${hand()}</div>
  <div class="abs" style="left:620px;top:1120px;width:320px;height:320px;border-radius:50%;background:${C.areia}"></div>

// ---------- Renderer ----------
const R={};
function idle(key,t,ph=0){const F=FIG[key]; blink(F.id,t,ph); }

function rise(el,t,a=0,d=.5,dist=200){el.style.transform=`translateY(${(1-eo(lin(t,a,a+d)))*dist}px)`}
function hide(el,t,a){if(t<a)el.style.opacity=0}
R.s1=t=>{sh('s1',t);

  rise($('s2L'),t,0,.45,300);
  const w=$('s2w'); txtIn(w,t,.8,.3); hide(w,t,.8); $('s2sp').style.transform=`rotate(${t*360}deg)`;
  txtIn($('s2s'),t,1.8,.35); hide($('s2s'),t,1.8);

  const F=FIG.s2; idle('s2',t,.2); rise($('s2B'),t,0,.5,260);
  const yawn=t>1.0&&t<1.7; mouth(F.id,yawn?'o':t>=1.8?'grin':'flat');

  const z=$('e1z'); z.style.transform=t>1.4&&t<1.7?`scale(${1+.06*Math.sin(lin(t,1.4,1.7)*Math.PI)})`:'none';

// ---------- Mini-Uhr (global) ----------
const STOP=ST.e4+.8;
function miniAt(t){const m=$('mc'); if(t<ST.s2||t>=ST.end){m.style.display='none';return}
  m.style.display='block';
  const ap=lin(t,ST.s2+.15,ST.s2+.5); m.style.opacity=ap;
  let ang= t<ST.s2+2.4? t*900 : t<STOP? tick(t) : tick(STOP);
  setHand('mu',ang);
  const lt=t-ST.e4; let x=MX,y=MY,s=ap>0&&ap<1?back(ap):1;
  if(lt>=0&&lt<1.4){const p=eio(lin(lt,0,.5)), qx=eio(lin(lt,1.0,1.2)), qy=eio(lin(lt,1.12,1.4)); const kx=p*(1-qx), ky=p*(1-qy);
    x=MX+(620-MX)*kx; y=MY+(1100-MY)*ky; s=1+2.2*ky;}
  m.style.transform=`translate(${x-MX}px,${y-MY}px) scale(${s})`;
  $('mucrown').setAttribute('transform',lt>.8&&lt<.95?'translate(0 6)':'');
  ring($('mcr'),t,STOP);
  popIn($('mck'),t,ST.e4+1.45,.3);}

function sceneAt(t){let c=0;for(let i=0;i<S.length;i++)if(t>=S[i][1])c=i;return c}
function render(t){const i=sceneAt(t); const [id,st]=S[i];
  document.querySelectorAll('.scene').forEach(s=>{s.style.display='none';s.style.clipPath='none';s.style.zIndex=1});
  const cur=$(id); cur.style.display='block'; R[id](t-st);
  const tr=TR[id]; const d=t-st; const td=(tr&&tr.d)||TD;
  if(tr&&d<td&&i>0){const [pid,pst]=S[i-1]; const prev=$(pid); prev.style.display='block'; prev.style.zIndex=1; cur.style.zIndex=2; R[pid](t-pst);
    const p=eio(d/td);
    if(tr.k==='circle')cur.style.clipPath=`circle(${p*2300}px at ${tr.x}px ${tr.y}px)`;
    if(tr.k==='top')cur.style.clipPath=`inset(0 0 ${(1-p)*100}% 0)`;}
  miniAt(t);
  stage.style.opacity=1-lin(t,END-1.0,END);
}
