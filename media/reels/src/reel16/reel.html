<script>
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lin=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const expo=x=>x>=1?1:1-Math.pow(2,-10*x);
const quint=x=>x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2;
const back=x=>{const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const CUT=new URLSearchParams(location.search).get('cut');
const HOLDS=CUT==='gmb'?[[20.5,1.8]]:[[20.5,1.8],[24.0,1.0],[29.0,0.3]];   // [Master-Zeit, Halt in s] – gleiche Liste in audio.py
const GCUT=20.5+1.8+0.5, GJ=29.5-GCUT;   // GMB: Ausgabe 22,8 -> Master 29,5 (Endcard)
const END=CUT==='gmb'?35-GJ:35+HOLDS.reduce((a,h)=>a+h[1],0);
// Ausgabe-Zeit -> Master-Zeit. Halte-Punkte geben A4 (13 Wörter) und A5 (12 Wörter) je ≥ 0,4 s/Wort (Raster D3);
// in jedem Halt gibt es ein eigenes Bildereignis (Haken auf der Mappe 21,0 s, Pille „sem custo extra" 25,5 s).
const MM=t=>{let o=0; for(const [h,d] of HOLDS){if(t<h+o) return t-o; if(t<h+o+d) return h; o+=d;} return t-o;};
const M=t=>CUT!=='gmb'?MM(t):(t<GCUT?MM(t):t+GJ);   // GMB: nach A4 (22,8 s) direkt Endcard + Loop-Naht, 28,3 s

// ---------- Chat-Daten (Text = Storyboard, jede Faktenaussage mit Quelle) ----------
const SRC='<svg width="40" height="40" viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z" fill="none" stroke="#1F3B35" stroke-width="2.2" stroke-linejoin="round"/><path d="M8.5 12h7M8.5 15.5h7M8.5 8.5h4" stroke="#1F3B35" stroke-width="2.2" stroke-linecap="round"/></svg>';
const MSG={
 J1:{w:'J',big:1,h:'Sua certidão alemã travou no cartório?',ex:'<div class="ynrow">Comenta <span class="yn">SIM</span><span class="yn">NÃO</span></div>'},
 TY:{w:'A',h:'<span class="dots"><i></i><i></i><i></i></span>'},
 A1:{w:'A',name:'Ana',h:'Normal! Falta a <span class="hi">tradução juramentada</span>.'},
 A2:{w:'A',h:'Documento estrangeiro só tem efeito legal no Brasil <span class="hi">traduzido pro português</span>.',src:'Código Civil, art. 224'},
 J2:{w:'J',h:'E a apostila? Faço aqui no Brasil?'},
 A3:{w:'A',h:'Não: é feita <span class="hi">na Alemanha</span>, antes da tradução.',src:'Decreto 8.660/2016 (Apostila)'},
 J3:{w:'J',h:'E pra registrar nosso casamento aqui?'},
 A4:{w:'A',h:'Traslado, entre outros documentos: certidão alemã apostilada + tradução juramentada <span class="hi">feita no Brasil</span>.',src:'Res. CNJ 155/2012, art. 13'},
 A5:{w:'A',h:'A página da apostila entra na tradução: <span class="hi">sem custo extra</span> (documento padrão).'},
 J4:{w:'J',h:'Tem até em alemão!'},
 A6:{w:'A',h:'Sem CPF? Tem opção <span class="hi">pra estrangeiro</span>.'},
 J5:{w:'A',big:1,name:'traduzme',h:'Preço na hora, no site.'},
};
// Szenen: ab Zeit t sichtbare Nachrichten (oben -> unten); neue Nachricht poppt bei ihrem ersten Auftreten
const SC0=[[0,['J1']],[0.6,['J1','TY']],[2.5,['J1','A1']],[5.0,['A1','A2']],[9.0,['A2','J2']],[11.0,['J2','A3']],[15.0,['A3','J3']],[17.0,['J3','A4']],[19.0,['A4']],
          [21.0,['A5']],[25.0,['J4']],[27.0,['J4','A6']],[29.5,['J5']],[34.6,['J1']]];
const SC=CUT==='gmb'?SC0.filter(([t])=>t<21||t>=29.5):SC0;
const Y0=420, GAP=30;
const chat=$('chat'), EL={};
for(const [k,m] of Object.entries(MSG)){const d=document.createElement('div'); d.className='msg '+m.w+(m.big?' big':''); d.id='m_'+k;
  d.innerHTML=(m.name?`<div class="name">${m.name}</div>`:'')+`<div class="bub">${m.h}</div>`+(m.ex||'')+(m.src?`<div class="src">${SRC}${m.src}</div>`:'');
  d.style.display='none'; chat.appendChild(d); EL[k]=d;}
// Tipp-Punkte
const st=document.createElement('style'); st.textContent='.dots{display:inline-flex;gap:16px;padding:14px 6px}.dots i{width:22px;height:22px;border-radius:50%;background:#fff;display:block}'; document.head.appendChild(st);
const H={}; function measure(){for(const k in EL){const e=EL[k]; e.style.display='block'; e.style.visibility='hidden'; e.style.width=(Math.ceil(e.getBoundingClientRect().width)+2)+'px'; H[k]=e.offsetHeight;} LAY=SC.map(([t,l])=>[t,l,layout(l)]);}
function layout(list){const y={}; let c=Y0; for(const k of list){y[k]=c; c+=H[k]+GAP;} return y;}
let LAY=[]; window.READY=false;   // qa_frames wartet auf READY
const firstSeen={}; for(const [t,l] of SC) for(const k of l) if(!(k in firstSeen)) firstSeen[k]=t;
// Abnahme 16-2: Chat-Schritt in drei sauberen Phasen VOR dem Schlag des nächsten Schritts:
// (1) wegfallende Blasen aus, (2) bleibende Blasen rücken hoch, (3) auf dem Schlag poppt die neue Blase an ihrem Endplatz.
// Nie zwei Blasen übereinander, kein Überblenden von Text.
function renderChat(t){
  if(!LAY.length) measure();   // Absicherung, falls render() vor READY aufgerufen wird (Prüfwerkzeuge unter Last)
  let i=0; for(let j=0;j<LAY.length;j++) if(t>=LAY[j][0]) i=j;
  const [t0,list,Y]=LAY[i]; const prev=i>0?LAY[i-1]:null; const nx=LAY[i+1]||null;
  let fa=0,fb=0,ma=0,mb=0, moving=false;
  if(nx){const n0=nx[0]; moving=list.some(k=>nx[1].includes(k)&&nx[2][k]!==Y[k]);
    if(moving){fa=n0-.45; fb=n0-.35; ma=n0-.35; mb=n0-.05;} else {fa=n0-.1; fb=n0;}}
  for(const k in EL){const e=EL[k]; const show=list.includes(k); let y=Y[k]||0, o=1, sc=1;
    if(show){const isNew=!(prev&&prev[1].includes(k));
      if(isNew){const a=lin(t,t0,t0+.3); sc=.6+.4*eo(a);}   // ab dem Schlag sichtbar (kein Leerbild)
      if(k==='J1'&&t0===34.6){const a=lin(t,34.6,34.9); sc=.85+.15*eo(a);}  // Loop-Naht
      if(i===0&&k==='J1'){o=1;sc=1;}
      if(nx){ if(!nx[1].includes(k)) o*=1-lin(t,fa,fb);
              else if(moving) y=Y[k]+(nx[2][k]-Y[k])*quint(lin(t,ma,mb)); }
    }
    const vis=show&&o>0.001; e.style.display=vis?'block':'none'; e.style.visibility='visible'; if(!vis) continue;
    const x=MSG[k].w==='J'?90:900-e.offsetWidth;
    e.style.left=x+'px'; e.style.top=y+'px'; e.style.opacity=o; e.style.transform=`scale(${sc})`;
  }
  // Tipp-Punkte animieren
  EL.TY.querySelectorAll('i').forEach((d,n)=>{d.style.transform=`translateY(${-10*Math.max(0,Math.sin(t*7-n*.8))}px)`; d.style.opacity=.55+.45*Math.max(0,Math.sin(t*7-n*.8));});
}

// ---------- Objekt-Keyframes: [t, x, y, scale, rot, opacity] (Mittelpunkt in Bildschirm-px) ----------
function kf(K,t){if(t<=K[0][0])return K[0].slice(1); for(let i=0;i<K.length-1;i++){const a=K[i],b=K[i+1]; if(t<=b[0]){const p=b[6]==='x'?expo(lin(t,a[0],b[0])):quint(lin(t,a[0],b[0])); return a.slice(1,6).map((v,j)=>v+(b[j+1]-v)*p)}} return K[K.length-1].slice(1,6);}
function put(el,v,dy=0){const [x,y,s,r,o]=v; el.style.transform=`translate(${x}px,${y+dy}px) rotate(${r}deg) scale(${s})`; el.style.opacity=o; el.style.display=o<=0.001?'none':'block';}

    T.style.transform=`translate(${sx+(1-eo(fp))*220}px,${sy+(1-eo(fp))*160}px) scale(${t>27.85&&t<28.0?.8:1})`;

  } else {$('tap').style.opacity=0; $('tapR').style.opacity=0;}
  {const fp=lin(tv,21.0,21.3); const F=$('fchk'); F.style.opacity=CUT!=='gmb'||tv<GCUT?(tv>=21.0&&t<20.95?1:0):0;
